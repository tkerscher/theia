[project]
site_name = "Theia Documentation"
site_description = "Documentation for the Theia photon propagation framework"
site_author = "Tobias Kerscher"
#site_url = ""

copyright = """
Copyright &copy; 2026 Tobias Kerscher
"""

repo_url = "https://github.com/tkerscher/theia"
repo_name = "tkerscher/theia"

docs_dir = "docs"

extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js"
]

nav = [
    {"About" = "about.md"},
    {"Get Started" = "start.md"},
    {"Documentation" = [
        "index.md",
        {"Scene" = [
            # "scene/index.md",,
            {"Meshes" = "scene/mesh.md"},
            {"Material" = "scene/material.md"},
            {"Scene" = "scene/scene.md"},
            {"Units" = "scene/units.md"}
        ]},
        {"Simulation" = [
            {"Pipeline" = "pipeline/pipeline.md"},
            {"Components" = "pipeline/components.md"},
            {"Tracer" = "pipeline/tracer.md"},
        ]},
        {"Extending" = [
            {"GPU Programming" = "extend/glsl.md"},
            {"Components" = "extend/components.md"},
            {"Physic Model" = "extend/physic_model.md"},
            {"Utils" = "extend/util.md"},
        ]},
        {"Physics" = [
            {"Propagation Model" = "model.md"}
        ]}
    ]},
    {"API" = [
        "api/index.md",
        {"theia.camera" = "api/camera.md"},
        {"theia.compiler" = "api/compiler.md"},
        {"theia.device" = "api/device.md"},
        {"theia.light" = "api/light.md"},
        {"theia.lookup" = "api/lookup.md"},
        {"theia.material" = "api/material.md"},
        {"theia.medium" = "api/medium.md"},
        {"theia.model" = "api/model.md"},
        {"theia.property" = "api/property.md"},
        {"theia.random" = "api/random.md"},
        {"theia.ray" = "api/ray.md"},
        {"theia.response" = "api/response.md"},
        {"theia.scene" = "api/scene.md"},
        {"theia.surface" = "api/surface.md"},
        {"theia.target" = "api/target.md"},
        {"theia.task" = "api/task.md"},
        {"theia.testing" = "api/testing.md"},
        {"theia.trace" = "api/trace.md"},
        {"theia.units" = "api/units.md"},
        {"theia.volume" = "api/volume.md"},
    ]}
]

[project.theme]
language = "en"
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    #"navigation.instant", # requires site_url
    #"navigation.instant.prefetch",
    #"navigation.instant.progress",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlighting",
    "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# markdown extensions
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
inherited_members = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
